openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: Minecraft mod and plugin projects
  - name: storage
    description: Project icon uploads and file serving
  - name: minecraft
    description: Supported Minecraft releases
  - name: billing
    description: Purple Creator Plus checkout and account entitlement
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /minecraft/versions:
    get:
      operationId: getMinecraftVersions
      tags: [minecraft]
      summary: List supported stable Minecraft releases from 1.20.1 onward
      responses:
        "200":
          description: Exact stable Minecraft release IDs, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinecraftVersionsResponse"
        "503":
          description: Mojang version metadata is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /billing/status:
    get:
      operationId: getBillingStatus
      tags: [billing]
      summary: Get the signed-in user's plan and project limit
      responses:
        "200":
          description: Current plan entitlement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingStatus"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /billing/tosthost/checkout:
    post:
      operationId: createTostHostCheckout
      tags: [billing]
      summary: Start the fixed-price 20 PLN Plus checkout
      responses:
        "200":
          description: TostHost payment link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Payment provider could not create checkout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Payment provider is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /billing/tosthost/webhook:
    post:
      operationId: receiveTostHostWebhook
      tags: [billing]
      summary: Receive and independently verify a TostHost payment notification
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TostHostWebhook"
      responses:
        "204":
          description: Notification processed or safely ignored
        "401":
          description: Invalid webhook token
        "503":
          description: TostHost status could not be verified
  /billing/tosthost/return:
    get:
      operationId: returnFromTostHost
      tags: [billing]
      summary: Verify checkout return and redirect to the app
      parameters:
        - name: reference
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "302":
          description: Redirect to the app with payment result
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List the signed-in user's projects
      responses:
        "200":
          description: Projects owned by the current user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a Minecraft project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The account has reached its project limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getProject
      tags: [projects]
      summary: Get one owned project
      responses:
        "200":
          description: Requested project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update an owned project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Project updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete an owned project
      responses:
        "204":
          description: Project deleted
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /projects/{id}/generate:
    post:
      operationId: generateProjectArtifact
      tags: [projects]
      summary: Build a downloadable Minecraft mod or plugin jar
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Compiled Minecraft artifact
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/java-archive:
              schema:
                type: string
                format: binary
        "400":
          description: The project cannot be generated with its current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: The project source did not compile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Required Minecraft build tools or dependencies are unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a signed URL for a project icon upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Signed URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid upload metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectPath}:
    get:
      operationId: getStorageObject
      tags: [storage]
      summary: Serve an uploaded project icon
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File content
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MinecraftVersionsResponse:
      type: object
      properties:
        versions:
          type: array
          items:
            type: string
      required: [versions]
    BillingStatus:
      type: object
      properties:
        plan:
          type: string
          enum: [free, plus]
        projectLimit:
          type: integer
          enum: [10, 100]
      required: [plan, projectLimit]
    CheckoutResponse:
      type: object
      properties:
        paymentUrl:
          type: string
          format: uri
        amount:
          type: number
          enum: [20]
        currency:
          type: string
          enum: [PLN]
      required: [paymentUrl, amount, currency]
    TostHostWebhook:
      type: object
      properties:
        transactionId:
          type: string
        status:
          type: string
        isSandbox:
          type: boolean
        customReference:
          type: string
      required: [transactionId]
    ProjectBlock:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
        title:
          type: string
        settings:
          type: object
          additionalProperties: true
      required: [id, kind, title, settings]
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        category:
          type: string
          enum: [mod, plugin]
        version:
          type: string
        iconPath:
          type: [string, "null"]
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/ProjectBlock"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, name, category, version, iconPath, blocks, createdAt, updatedAt]
    ProjectInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        category:
          type: string
          enum: [mod, plugin]
        version:
          type: string
        iconPath:
          type: [string, "null"]
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/ProjectBlock"
      required: [name, category, version, blocks]
    ProjectUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        category:
          type: string
          enum: [mod, plugin]
        version:
          type: string
        iconPath:
          type: [string, "null"]
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/ProjectBlock"
      required: [name, category, version, blocks]
    UploadUrlRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          enum: [image/png, image/jpeg, image/webp, image/gif]
      required: [name, size, contentType]
    UploadUrlResponse:
      type: object
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
      required: [uploadURL, objectPath]
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: string
      required: [error]

